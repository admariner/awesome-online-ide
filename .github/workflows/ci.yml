name: CI

on:
  push:
    branches:
    - main
    tags:
    - '!*'
  pull_request:

jobs:
  build:
    runs-on: linux-xarm90
    steps:
    - uses: actions/checkout@v6
    - name: Use Node.js
      uses: actions/setup-node@v6
      with:
        node-version: 24
    - name: Lint
      run: npx awesome-lint@0.5.0
